<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The International 2026 - Multistream & Puntajes Liquipedia</title>
  
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --accent-gold: #f39c12;
      --text: #e1e6ed;
      --text-muted: #8c96a5;
      --border: #232a36;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 25px;
    }

    header h1 {
      margin: 0;
      color: var(--accent-gold);
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    header p {
      color: var(--text-muted);
      margin-top: 6px;
    }

    .section-title {
      font-size: 1.3rem;
      color: var(--accent-gold);
      margin-bottom: 15px;
      border-left: 4px solid var(--accent-gold);
      padding-left: 10px;
      font-weight: bold;
    }

    /* Grid para reproductores de Video */
    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }

    @media (max-width: 500px) {
      .streams-grid {
        grid-template-columns: 1fr;
      }
    }

    .stream-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .stream-header {
      padding: 12px 16px;
      background: #11151c;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .badge-twitch { color: #a970ff; font-weight: bold; }
    .badge-kick { color: #53FC18; font-weight: bold; }

    /* Contenedor Adaptativo Proporción 16:9 */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      background-color: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* Sección de Marcador de Liquipedia */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      color: #2ecc71;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: #2ecc71;
      border-radius: 50%;
      box-shadow: 0 0 10px #2ecc71;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .refresh-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: #e67e22;
      color: #fff;
    }

    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 40%;
      font-weight: 600;
    }

    .team.right {
      justify-content: flex-end;
    }

    .score-box {
      background: #0a0d12;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      border: 1px solid var(--border);
      color: var(--accent-gold);
      min-width: 60px;
      text-align: center;
    }

    .status-text {
      text-align: center;
      padding: 25px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>The International 2026</h1>
      <p>Centro de Transmisiones en Vivo y Marcador Liquipedia</p>
    </header>

    <!-- Sección de Transmisiones -->
    <div class="section-title">Transmisiones en Vivo</div>
    <div class="streams-grid">
      
      <!-- Twitch Player con Detección Dinámica de Dominio -->
      <div class="stream-card">
        <div class="stream-header">
          <span>Dota 2 TI Español</span>
          <span class="badge-twitch">Twitch</span>
        </div>
        <div class="video-container">
          <iframe 
            id="twitch-iframe"
            frameborder="0" 
            scrolling="no" 
            allowfullscreen="true">
          </iframe>
        </div>
      </div>

      <!-- Kick Player -->
      <div class="stream-card">
        <div class="stream-header">
          <span>MrChoco</span>
          <span class="badge-kick">Kick</span>
        </div>
        <div class="video-container">
          <iframe 
            src="https://player.kick.com/mrchoco" 
            frameborder="0" 
            scrolling="no" 
            allowfullscreen="true">
          </iframe>
        </div>
      </div>

    </div>

    <!-- Sección de Resultados -->
    <div class="section-title">Puntajes desde Liquipedia</div>
    <div class="status-bar">
      <div class="live-indicator">
        <div class="dot"></div>
        <span>Actualización Automática (Cada 60s)</span>
      </div>
      <button class="refresh-btn" onclick="loadLiquipediaData()">Actualizar Puntajes</button>
    </div>

    <div id="content" class="matches-list">
      <div class="status-text">Conectando con Liquipedia API...</div>
    </div>
  </div>

  <script>
    // 1. Detección automática del dominio actual para solucionar el bloqueo de Twitch
    const currentHost = window.location.hostname || 'localhost';
    const twitchIframe = document.getElementById('twitch-iframe');
    
    // Si se abre directo como archivo local file:///, sugerir o usar localhost
    const targetParent = (currentHost === '' || currentHost === 'file') ? 'localhost' : currentHost;
    twitchIframe.src = `https://player.twitch.tv/?channel=dota2ti_es&parent=${targetParent}&parent=localhost&parent=127.0.0.1`;

    // 2. Consulta API Liquipedia
    const TARGET_PAGE = 'https://liquipedia.net/dota2/api.php?action=parse&page=The_International/2026&format=json';
    const CORS_PROXY = 'https://api.allorigins.win/get?url=';

    async function loadLiquipediaData() {
      const container = document.getElementById('content');
      
      try {
        const response = await fetch(CORS_PROXY + encodeURIComponent(TARGET_PAGE));
        if (!response.ok) throw new Error('Error al conectar.');

        const wrapper = await response.json();
        const json = JSON.parse(wrapper.contents);

        if (!json?.parse?.text) throw new Error('Respuesta no válida.');

        const parser = new DOMParser();
        const doc = parser.parseFromString(json.parse.text['*'], 'text/html');

        renderMatches(doc, container);

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="status-text" style="color: #e74c3c;">
            No se pudieron obtener los datos en vivo en este momento. Revisa más tarde.
          </div>`;
      }
    }

    function renderMatches(doc, container) {
      const matchRows = doc.querySelectorAll('.match-row, .wikitable tr');
      let htmlContent = '';
      let count = 0;

      matchRows.forEach(row => {
        const teamLeft = row.querySelector('.team-left, .team-left-short')?.textContent.trim();
        const teamRight = row.querySelector('.team-right, .team-right-short')?.textContent.trim();
        const score = row.querySelector('.versus, .score')?.textContent.trim();

        if (teamLeft && teamRight) {
          count++;
          htmlContent += `
            <div class="match-card">
              <div class="team">${teamLeft}</div>
              <div class="score-box">${score || 'VS'}</div>
              <div class="team right">${teamRight}</div>
            </div>`;
        }
      });

      if (count > 0) {
        container.innerHTML = htmlContent;
      } else {
        container.innerHTML = `
          <div class="status-text">
            Sincronizado con Liquipedia. Los enfrentamientos aparecerán aquí durante la emisión oficial de las partidas.
          </div>`;
      }
    }

    // Carga inicial y temporizador de 1 minuto
    loadLiquipediaData();
    setInterval(loadLiquipediaData, 60000);
  </script>
</body>
</html>
