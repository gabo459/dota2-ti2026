<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquipedia Match Card Demo</title>
  <style>
    /* Reset básico y fondo oscuro estilo Liquipedia */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #0f1215;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Estilo del Botón / Tarjeta del Match */
    .match-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 320px;
      background-color: #1e2328;
      color: #fff;
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      border: 1px solid #32383e;
      user-select: none;
    }

    .match-card:hover {
      background-color: #2a3038;
      border-color: #454d55;
    }

    .match-card:active {
      transform: scale(0.99);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .team.winner {
      font-weight: bold;
      color: #4cd964;
    }

    .vs-divider {
      color: #6c757d;
      font-size: 14px;
      font-weight: bold;
    }

    /* Modal / Popup Overlay */
    .match-popup-overlay {
      display: none; /* Oculto por defecto */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(2px);
    }

    .match-popup-overlay.active {
      display: flex;
    }

    .match-popup-content {
      background-color: #121519;
      color: #e1e1e1;
      width: 580px;
      max-width: 95%;
      border-radius: 8px;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 1px solid #2a2e33;
    }

    .popup-close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .popup-close-btn:hover {
      color: #fff;
    }

    /* Header del Popup */
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2e33;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .header-team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      width: 40%;
    }

    .header-team.right {
      justify-content: flex-end;
    }

    .header-team img {
      width: 32px;
      height: 32px;
    }

    .header-score {
      text-align: center;
      width: 20%;
    }

    .header-score .score {
      display: block;
      font-size: 22px;
      font-weight: bold;
    }

    .header-score .format {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
    }

    /* Filas de Héroes Pickeados por Juego */
    .game-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1d22;
      margin-bottom: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid #23272d;
    }

    .heroes-container {
      display: flex;
      gap: 4px;
    }

    .heroes-container img {
      width: 36px;
      height: 22px;
      border-radius: 2px;
      object-fit: cover;
      background-color: #2a2e33;
    }

    /* Indicadores Radiant / Dire */
    .heroes-container.radiant img {
      border-bottom: 2px solid #28a745;
    }

    .heroes-container.dire img {
      border-bottom: 2px solid #dc3545;
    }

    .game-duration {
      font-size: 12px;
      color: #888;
      font-family: monospace;
    }

    .result-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
    }

    .result-badge.win {
      background-color: #28a745;
      color: #fff;
    }

    .result-badge.loss {
      background-color: #495057;
      color: #aaa;
    }

    /* Acordeón Veto / Bans */
    .veto-accordion {
      margin-top: 15px;
      font-size: 13px;
      background: #181b20;
      border-radius: 4px;
      padding: 10px;
      border: 1px solid #23272d;
    }

    .veto-accordion summary {
      cursor: pointer;
      color: #888;
      font-weight: bold;
    }

    .veto-content {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .veto-game {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ban-list {
      display: flex;
      gap: 4px;
    }

    .ban-list img {
      width: 28px;
      height: 16px;
      opacity: 0.5;
      filter: grayscale(100%);
      background-color: #2a2e33;
    }
  </style>
</head>
<body>

  <!-- Tarjeta del Partido (Match Card) -->
  <div class="match-card" data-match="match-1">
    <div class="team winner">
      <img src="https://via.placeholder.com/24/28a745/ffffff?text=F" alt="Team Falcons">
      <span class="name">Falcons</span>
      <span class="score">2</span>
    </div>
    <div class="vs-divider">:</div>
    <div class="team">
      <span class="score">1</span>
      <span class="name">LGD</span>
      <img src="https://via.placeholder.com/24/dc3545/ffffff?text=L" alt="LGD Gaming">
    </div>
  </div>

  <!-- Modal / Popup de Detalles del Match -->
  <div class="match-popup-overlay" id="popup-match-1">
    <div class="match-popup-content">
      <button class="popup-close-btn" aria-label="Cerrar">&times;</button>
      
      <!-- Encabezado del Popup -->
      <div class="popup-header">
        <div class="header-team winner">
          <img src="https://via.placeholder.com/32/28a745/ffffff?text=F" alt="Team Falcons">
          <span>Team Falcons</span>
        </div>
        <div class="header-score">
          <span class="score">2 : 1</span>
          <span class="format">(Bo3)</span>
        </div>
        <div class="header-team right">
          <span>LGD Gaming</span>
          <img src="https://via.placeholder.com/32/dc3545/ffffff?text=L" alt="LGD Gaming">
        </div>
      </div>

      <!-- Cuerpo del Popup: Lista de Juegos -->
      <div class="popup-body">
        
        <!-- JUEGO 1 -->
        <div class="game-row">
          <div class="result-badge win">G3</div>
          <div class="heroes-container radiant" title="Radiant (Falcons)">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H1" alt="Hero 1">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H2" alt="Hero 2">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H3" alt="Hero 3">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H4" alt="Hero 4">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H5" alt="Hero 5">
          </div>
          
          <div class="game-duration">40:46</div>
          
          <div class="heroes-container dire" title="Dire (LGD)">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H6" alt="Hero 6">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H7" alt="Hero 7">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H8" alt="Hero 8">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H9" alt="Hero 9">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H10" alt="Hero 10">
          </div>
          <div class="result-badge loss">P</div>
        </div>

        <!-- JUEGO 2 -->
        <div class="game-row">
          <div class="result-badge loss">P</div>
          <div class="heroes-container radiant" title="Radiant (Falcons)">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H1" alt="Hero 1">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H2" alt="Hero 2">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H3" alt="Hero 3">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H4" alt="Hero 4">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H5" alt="Hero 5">
          </div>
          
          <div class="game-duration">37:36</div>
          
          <div class="heroes-container dire" title="Dire (LGD)">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H6" alt="Hero 6">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H7" alt="Hero 7">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H8" alt="Hero 8">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H9" alt="Hero 9">
            <img src="https://via.placeholder.com/36x22/333/fff?text=H10" alt="Hero 10">
          </div>
          <div class="result-badge win">G3</div>
        </div>

        <!-- Acordeón de Bans / Vetos -->
        <details class="veto-accordion">
          <summary>Bans / Fase de Selección</summary>
          <div class="veto-content">
            <div class="veto-game">
              <span>Juego 1 Bans:</span>
              <div class="ban-list">
                <img src="https://via.placeholder.com/28x16/222/888?text=B1" alt="Ban 1">
                <img src="https://via.placeholder.com/28x16/222/888?text=B2" alt="Ban 2">
                <img src="https://via.placeholder.com/28x16/222/888?text=B3" alt="Ban 3">
              </div>
            </div>
          </div>
        </details>

      </div>
    </div>
  </div>

  <!-- JavaScript para la interactividad -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Abrir modal al hacer clic en la tarjeta del match
      const matchCards = document.querySelectorAll('.match-card');
      
      matchCards.forEach(card => {
        card.addEventListener('click', () => {
          const matchId = card.getAttribute('data-match');
          const popup = document.getElementById(`popup-${matchId}`);
          if (popup) {
            popup.classList.add('active');
          }
        });
      });

      // Cerrar modal con el botón X
      const closeBtns = document.querySelectorAll('.popup-close-btn');
      closeBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const popup = btn.closest('.match-popup-overlay');
          if (popup) {
            popup.classList.remove('active');
          }
        });
      });

      // Cerrar modal al hacer clic en el fondo oscuro
      const overlays = document.querySelectorAll('.match-popup-overlay');
      overlays.forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            overlay.classList.remove('active');
          }
        });
      });

      // Cerrar modal con la tecla Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.querySelectorAll('.match-popup-overlay.active').forEach(popup => {
            popup.classList.remove('active');
          });
        }
      });
    });
  </script>

</body>
</html>
